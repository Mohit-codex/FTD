<!DOCTYPE html>
<html>
<head>
  <title>Even or Odd</title>
</head>
<body>
  <h2>Even or Odd Checker</h2>

  <input type="number" id="numberInput" placeholder="Enter an integer">
  <button onclick="checkNumber()">Submit</button>

  <p id="result"></p>

  <script>
    function checkNumber() {
      // Get the number typed by the user
      let num = document.getElementById("numberInput").value;
      let result = document.getElementById("result");

      // Check that the input is a valid whole number
      if (num === "" || !Number.isInteger(Number(num))) {
        result.innerText = "Please enter a valid integer.";
        return;
      }

      // Even if remainder is 0, otherwise odd
      if (Number(num) % 2 === 0) {
        result.innerText = "Your number is Even";
      } else {
        result.innerText = "Your number is Odd";
      }
    }
  </script>
</body>
</html>
