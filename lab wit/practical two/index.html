<!DOCTYPE html>
<html>
<head>
    <title>My College Website</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        body {
           background: #8a2be2;  
background: -webkit-linear-gradient(to right, #f8f8ff, #ffa500, #8a2be2);  
background: linear-gradient(to right, #f8f8ff, #ffa500, #8a2be2);

            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background: #2774ae;  
background: -webkit-linear-gradient(to right, #002E5D, #002E5D, #2774ae);  
background: linear-gradient(to right, #002E5D, #002E5D, #2774ae); 
            color: white;
            text-align: center;
            padding: 10px;
        }

        nav {
            background: #fc4a1a; 
background: -webkit-linear-gradient(to right, #f7b733, #fc4a1a);  
background: linear-gradient(to right, #f7b733, #fc4a1a);
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            background-color: #0b4077;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My College</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Departments</a>
        <a href="#">Admissions</a>
        <a href="#">Contact</a>
    </nav>

    <section>
        <h2 style="color: #e74c3c; text-align:center;">About Us</h2>

        <p style="font-size:18px; text-align:center;">
            Our college is dedicated to excellence in education, research, and student development.
        </p>

        <img src="uiet_image.png" alt="College Campus" style="display:block; margin:20px auto; width:40%; border-radius:10px;">
    </section>

    <footer>
        <p>Designed by Mohit</p>
    </footer>
</body>
</html>
